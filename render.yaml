services:
  - type: web
    name: roadguard-ai
    env: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python server/app.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: FLASK_DEBUG
        value: 0
      - key: GOOGLE_MAPS_API_KEY
        sync: false
